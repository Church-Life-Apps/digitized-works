name: Verify releases and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types: [digitization-release]
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify library
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build.py
      - name: Verify generated site
        run: python3 scripts/verify_site.py dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy atomically
        id: deployment
        uses: actions/deploy-pages@v4

